name: Deploy Nous deux to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:web
      - run: node tests/supabase-model.test.mjs
      - run: node tests/calendar.test.mjs
      - run: node tests/chat-api.test.mjs
      - run: node tests/voices-places.test.mjs
      - run: node tests/life.test.mjs
      - run: node tests/meals.test.mjs
      - run: node tests/photos.test.mjs
      - run: node tests/interaction.test.mjs
      - run: node tests/recipe-discovery.test.mjs
      - run: node tests/recipe-library.test.mjs
      - run: node tests/recipe-experience.test.mjs
      - run: node tests/ai-settings.test.mjs
      - run: node tests/accessibility.test.mjs
      - run: node tests/design-system.test.mjs
      - run: node tests/mobile-ui.test.mjs
      - run: pnpm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
