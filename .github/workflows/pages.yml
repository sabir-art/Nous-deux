name: Deploy Nous deux to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:web
      - run: node tests/supabase-model.test.mjs
      - run: node tests/daily-calls.test.mjs
      - run: node tests/calendar.test.mjs
      - run: node tests/invitation-calendar.test.mjs
      - run: node tests/chat-api.test.mjs
      - run: node tests/voices-places.test.mjs
      - run: node tests/chat-attachments.test.mjs
      - run: node tests/chat-navigation-ui.test.mjs
      - run: node tests/life.test.mjs
      - run: node tests/meals.test.mjs
      - run: node tests/photos.test.mjs
      - run: node tests/interaction.test.mjs
      - run: node tests/recipe-discovery.test.mjs
      - run: node tests/recipe-library.test.mjs
      - run: node tests/recipe-experience.test.mjs
      - run: node tests/ai-settings.test.mjs
      - run: node tests/accessibility.test.mjs
      - run: node tests/design-system.test.mjs
      - run: node tests/mobile-ui.test.mjs
      - name: WebKit and Chromium interface checks
        run: |
          npm install --prefix "$RUNNER_TEMP/nous-deux-browsers" --no-package-lock --ignore-scripts playwright@1.62.1 @electric-sql/pglite@0.3.14
          PGLITE_MODULE="$RUNNER_TEMP/nous-deux-browsers/node_modules/@electric-sql/pglite" node tests/daily-database.test.mjs
          node "$RUNNER_TEMP/nous-deux-browsers/node_modules/playwright/cli.js" install --with-deps chromium webkit
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/nous-deux-browsers/node_modules/playwright" node tests/browser-layout.test.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/nous-deux-browsers/node_modules/playwright" node tests/daily-browser.test.mjs
      - run: pnpm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
